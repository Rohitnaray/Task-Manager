<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TaskFlow — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="api.js"></script>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c28;
    --border: #2a2a3d;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --green: #00d68f;
    --yellow: #ffaa00;
    --red: #ff4757;
    --blue: #00b4d8;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --radius: 12px;
    --sidebar: 240px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; height:100vh; display:flex; overflow:hidden; }

  /* ── SIDEBAR ── */
  .sidebar {
    width: var(--sidebar); background:var(--surface);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column;
    padding:0; flex-shrink:0;
  }
  .sidebar-logo {
    font-family:'Syne',sans-serif; font-size:1.4rem; font-weight:800;
    padding:24px 20px; border-bottom:1px solid var(--border); letter-spacing:-0.5px;
  }
  .sidebar-logo span { color:var(--accent); }
  .sidebar-user {
    padding:16px 20px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:10px;
  }
  .avatar {
    width:36px; height:36px; border-radius:50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:.9rem; flex-shrink:0;
  }
  .sidebar-user-info { overflow:hidden; }
  .sidebar-user-name { font-weight:500; font-size:.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .role-badge {
    font-size:.68rem; padding:2px 7px; border-radius:20px; font-weight:600; letter-spacing:.5px;
    background:rgba(108,99,255,.2); color:var(--accent);
  }
  .role-badge.admin { background:rgba(255,101,132,.2); color:var(--accent2); }

  nav { flex:1; padding:12px 0; overflow-y:auto; }
  .nav-item {
    display:flex; align-items:center; gap:12px;
    padding:11px 20px; cursor:pointer; font-size:.9rem;
    color:var(--muted); transition:all .15s; border:none; background:none; width:100%;
    text-align:left;
  }
  .nav-item:hover { background:var(--surface2); color:var(--text); }
  .nav-item.active { background:rgba(108,99,255,.12); color:var(--accent); border-right:3px solid var(--accent); }
  .nav-icon { font-size:1.1rem; width:20px; text-align:center; }
  .nav-label { font-size:.9rem; }

  .sidebar-footer { padding:16px; border-top:1px solid var(--border); }
  .btn-logout {
    width:100%; padding:10px; background:none;
    border:1px solid var(--border); border-radius:8px;
    color:var(--muted); font-family:'DM Sans',sans-serif;
    cursor:pointer; transition:all .15s; font-size:.85rem;
  }
  .btn-logout:hover { border-color:var(--red); color:var(--red); }

  /* ── MAIN ── */
  .main { flex:1; overflow-y:auto; padding:0; }
  .topbar {
    padding:20px 28px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; background:var(--bg); z-index:10;
  }
  .page-title { font-family:'Syne',sans-serif; font-size:1.4rem; font-weight:700; }
  .btn-primary {
    padding:10px 20px; background:var(--accent);
    border:none; border-radius:8px; color:#fff;
    font-family:'Syne',sans-serif; font-weight:700; cursor:pointer;
    font-size:.9rem; transition:all .2s;
  }
  .btn-primary:hover { background:#7c75ff; transform:translateY(-1px); }

  .content { padding:28px; }

  /* ── STATS ── */
  .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; margin-bottom:32px; }
  .stat-card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:20px;
    animation:fadeUp .4s ease both;
  }
  .stat-card:nth-child(2) { animation-delay:.05s; }
  .stat-card:nth-child(3) { animation-delay:.1s; }
  .stat-card:nth-child(4) { animation-delay:.15s; }
  .stat-card:nth-child(5) { animation-delay:.2s; }
  .stat-card:nth-child(6) { animation-delay:.25s; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }
  .stat-icon { font-size:1.5rem; margin-bottom:8px; }
  .stat-value { font-family:'Syne',sans-serif; font-size:2rem; font-weight:800; }
  .stat-label { color:var(--muted); font-size:.8rem; margin-top:2px; }

  /* ── SECTION ── */
  .section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .section-title { font-family:'Syne',sans-serif; font-size:1.1rem; font-weight:700; }

  /* ── PROJECT CARDS ── */
  .projects-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
  .project-card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:20px; cursor:pointer;
    transition:all .2s; animation:fadeUp .4s ease both;
  }
  .project-card:hover { border-color:var(--accent); transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.3); }
  .project-name { font-family:'Syne',sans-serif; font-weight:700; font-size:1rem; margin-bottom:6px; }
  .project-desc { color:var(--muted); font-size:.85rem; margin-bottom:14px; line-height:1.4; }
  .project-meta { display:flex; align-items:center; justify-content:space-between; }
  .project-owner { font-size:.78rem; color:var(--muted); }
  .badge {
    font-size:.72rem; padding:3px 9px; border-radius:20px; font-weight:600; letter-spacing:.4px;
  }
  .badge-active   { background:rgba(0,214,143,.15);  color:var(--green); }
  .badge-completed{ background:rgba(0,180,216,.15);  color:var(--blue); }
  .badge-on_hold  { background:rgba(255,170,0,.15);  color:var(--yellow); }

  /* ── TASK LIST ── */
  .task-list { display:flex; flex-direction:column; gap:10px; }
  .task-item {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:16px;
    display:flex; align-items:center; gap:14px;
    animation:fadeUp .3s ease both;
  }
  .task-item:hover { border-color:var(--border); background:var(--surface2); }
  .priority-dot {
    width:8px; height:8px; border-radius:50%; flex-shrink:0;
  }
  .priority-dot.HIGH   { background:var(--red); }
  .priority-dot.MEDIUM { background:var(--yellow); }
  .priority-dot.LOW    { background:var(--green); }
  .task-info { flex:1; }
  .task-title { font-weight:500; font-size:.95rem; }
  .task-sub { color:var(--muted); font-size:.8rem; margin-top:3px; }
  .status-select {
    padding:5px 10px; background:var(--surface2); border:1px solid var(--border);
    border-radius:6px; color:var(--text); font-family:'DM Sans',sans-serif;
    font-size:.8rem; cursor:pointer; outline:none;
  }
  .overdue-tag { font-size:.72rem; color:var(--red); font-weight:600; background:rgba(255,71,87,.1); padding:2px 7px; border-radius:4px; }

  /* ── PROJECT DETAIL ── */
  .detail-header {
    margin-bottom:24px;
  }
  .detail-title { font-family:'Syne',sans-serif; font-size:1.6rem; font-weight:800; }
  .detail-desc { color:var(--muted); margin-top:6px; }
  .detail-meta { display:flex; gap:16px; margin-top:12px; flex-wrap:wrap; }
  .detail-meta span { font-size:.82rem; color:var(--muted); }
  .detail-meta strong { color:var(--text); }

  .members-list { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px; }
  .member-chip {
    display:flex; align-items:center; gap:6px;
    background:var(--surface2); border:1px solid var(--border);
    border-radius:20px; padding:4px 12px 4px 4px; font-size:.82rem;
  }
  .member-chip .avatar { width:24px; height:24px; font-size:.7rem; }
  .member-chip .remove-btn {
    background:none; border:none; color:var(--muted);
    cursor:pointer; margin-left:4px; font-size:.8rem;
  }
  .member-chip .remove-btn:hover { color:var(--red); }

  .kanban { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .kanban-col { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }
  .kanban-col-title { font-family:'Syne',sans-serif; font-size:.85rem; font-weight:700; margin-bottom:14px; text-transform:uppercase; letter-spacing:1px; display:flex; align-items:center; gap:8px; }
  .kanban-col-title .count { background:var(--surface2); padding:2px 8px; border-radius:10px; font-size:.75rem; color:var(--muted); }
  .kanban-task {
    background:var(--surface2); border:1px solid var(--border);
    border-radius:8px; padding:12px; margin-bottom:8px;
    cursor:pointer; transition:all .15s;
  }
  .kanban-task:hover { border-color:var(--accent); }
  .kanban-task-title { font-size:.88rem; font-weight:500; }
  .kanban-task-meta { font-size:.75rem; color:var(--muted); margin-top:6px; display:flex; gap:8px; align-items:center; }
  .task-actions { display:flex; gap:6px; margin-top:8px; }
  .btn-sm {
    padding:4px 10px; border-radius:6px; font-size:.75rem; border:1px solid var(--border);
    background:none; color:var(--muted); cursor:pointer; transition:all .15s;
  }
  .btn-sm:hover { background:var(--surface); color:var(--text); }
  .btn-sm.danger:hover { border-color:var(--red); color:var(--red); }

  /* ── MODAL ── */
  .modal-overlay {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,.7); backdrop-filter:blur(4px);
    z-index:100; align-items:center; justify-content:center;
  }
  .modal-overlay.show { display:flex; }
  .modal {
    background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:28px; width:460px; max-width:95vw;
    max-height:90vh; overflow-y:auto; animation:fadeUp .25s ease;
  }
  .modal-title { font-family:'Syne',sans-serif; font-size:1.2rem; font-weight:700; margin-bottom:20px; }
  .form-group { margin-bottom:16px; }
  label { display:block; font-size:.78rem; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.5px; }
  input,select,textarea {
    width:100%; padding:11px 13px;
    background:var(--surface2); border:1px solid var(--border);
    border-radius:8px; color:var(--text);
    font-family:'DM Sans',sans-serif; font-size:.9rem; outline:none;
    transition: border-color .2s;
  }
  input:focus,select:focus,textarea:focus { border-color:var(--accent); }
  textarea { resize:vertical; min-height:80px; }
  select option { background:var(--surface2); }
  .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:20px; }
  .btn-cancel {
    padding:10px 18px; background:none; border:1px solid var(--border);
    border-radius:8px; color:var(--muted); cursor:pointer; font-family:'DM Sans',sans-serif;
    transition:all .15s;
  }
  .btn-cancel:hover { color:var(--text); border-color:var(--text); }
  .btn-save {
    padding:10px 20px; background:var(--accent); border:none;
    border-radius:8px; color:#fff; font-family:'Syne',sans-serif;
    font-weight:700; cursor:pointer; transition:all .2s;
  }
  .btn-save:hover { background:#7c75ff; }

  .empty { text-align:center; padding:48px; color:var(--muted); }
  .empty-icon { font-size:2.5rem; margin-bottom:8px; }
  .back-btn {
    background:none; border:none; color:var(--accent);
    cursor:pointer; font-family:'DM Sans',sans-serif; font-size:.9rem;
    display:flex; align-items:center; gap:4px; margin-bottom:8px;
    padding:0;
  }
  .back-btn:hover { text-decoration:underline; }

  .toast {
    position:fixed; bottom:24px; right:24px;
    background:var(--surface2); border:1px solid var(--border);
    border-radius:10px; padding:14px 20px; font-size:.88rem;
    z-index:999; animation:slideIn .3s ease;
    max-width:300px;
  }
  .toast.success { border-color:var(--green); color:var(--green); }
  .toast.error   { border-color:var(--red);   color:var(--red); }
  @keyframes slideIn { from{transform:translateY(20px);opacity:0} to{transform:none;opacity:1} }

  .add-member-row { display:flex; gap:8px; align-items:center; }
  .add-member-row select { flex:1; }
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">Task<span>Flow</span></div>
  <div class="sidebar-user">
    <div class="avatar" id="sb-avatar"></div>
    <div class="sidebar-user-info">
      <div class="sidebar-user-name" id="sb-name"></div>
      <span class="role-badge" id="sb-role"></span>
    </div>
  </div>
  <nav>
    <button class="nav-item active" onclick="showPage('dashboard')" id="nav-dashboard">
      <span class="nav-icon">📊</span><span class="nav-label">Dashboard</span>
    </button>
    <button class="nav-item" onclick="showPage('projects')" id="nav-projects">
      <span class="nav-icon">📁</span><span class="nav-label">Projects</span>
    </button>
    <button class="nav-item" onclick="showPage('my-tasks')" id="nav-my-tasks">
      <span class="nav-icon">✅</span><span class="nav-label">My Tasks</span>
    </button>
  </nav>
  <div class="sidebar-footer">
    <button class="btn-logout" onclick="logout()">Sign Out</button>
  </div>
</aside>

<!-- MAIN -->
<main class="main" id="main">
  <!-- Dashboard Page -->
  <div id="page-dashboard">
    <div class="topbar">
      <div class="page-title">Dashboard</div>
    </div>
    <div class="content">
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card"><div class="stat-icon">📁</div><div class="stat-value" id="s-projects">—</div><div class="stat-label">Projects</div></div>
        <div class="stat-card"><div class="stat-icon">📋</div><div class="stat-value" id="s-total">—</div><div class="stat-label">Total Tasks</div></div>
        <div class="stat-card"><div class="stat-icon">🕐</div><div class="stat-value" id="s-todo">—</div><div class="stat-label">To Do</div></div>
        <div class="stat-card"><div class="stat-icon">⚡</div><div class="stat-value" id="s-progress">—</div><div class="stat-label">In Progress</div></div>
        <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-value" id="s-done">—</div><div class="stat-label">Completed</div></div>
        <div class="stat-card"><div class="stat-icon">🔴</div><div class="stat-value" id="s-overdue">—</div><div class="stat-label">Overdue</div></div>
      </div>
    </div>
  </div>

  <!-- Projects Page -->
  <div id="page-projects" style="display:none">
    <div class="topbar">
      <div class="page-title">Projects</div>
      <button class="btn-primary" onclick="openProjectModal()">+ New Project</button>
    </div>
    <div class="content">
      <div class="projects-grid" id="projects-grid"></div>
    </div>
  </div>

  <!-- Project Detail Page -->
  <div id="page-project-detail" style="display:none">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="back-btn" onclick="showPage('projects')">← Back</button>
        <div class="page-title" id="detail-title"></div>
      </div>
      <button class="btn-primary" onclick="openTaskModal()">+ Add Task</button>
    </div>
    <div class="content">
      <div class="detail-header" id="detail-header"></div>
      <div class="section-header">
        <div class="section-title">Team Members</div>
        <button class="btn-sm" onclick="openAddMemberModal()" id="add-member-btn">+ Add Member</button>
      </div>
      <div class="members-list" id="members-list"></div>
      <div class="section-header" style="margin-top:24px">
        <div class="section-title">Tasks</div>
      </div>
      <div class="kanban" id="kanban-board"></div>
    </div>
  </div>

  <!-- My Tasks Page -->
  <div id="page-my-tasks" style="display:none">
    <div class="topbar">
      <div class="page-title">My Tasks</div>
    </div>
    <div class="content">
      <div class="task-list" id="my-task-list"></div>
    </div>
  </div>
</main>

<!-- PROJECT MODAL -->
<div class="modal-overlay" id="project-modal">
  <div class="modal">
    <div class="modal-title" id="project-modal-title">New Project</div>
    <div class="form-group"><label>Project Name</label><input id="pm-name" placeholder="e.g. Website Redesign" /></div>
    <div class="form-group"><label>Description</label><textarea id="pm-desc" placeholder="What is this project about?"></textarea></div>
    <div class="form-group"><label>Status</label>
      <select id="pm-status">
        <option value="ACTIVE">Active</option>
        <option value="ON_HOLD">On Hold</option>
        <option value="COMPLETED">Completed</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('project-modal')">Cancel</button>
      <button class="btn-save" onclick="saveProject()">Save Project</button>
    </div>
  </div>
</div>

<!-- TASK MODAL -->
<div class="modal-overlay" id="task-modal">
  <div class="modal">
    <div class="modal-title" id="task-modal-title">New Task</div>
    <div class="form-group"><label>Title</label><input id="tm-title" placeholder="Task title" /></div>
    <div class="form-group"><label>Description</label><textarea id="tm-desc" placeholder="Details..."></textarea></div>
    <div class="form-group"><label>Priority</label>
      <select id="tm-priority">
        <option value="LOW">Low</option>
        <option value="MEDIUM" selected>Medium</option>
        <option value="HIGH">High</option>
      </select>
    </div>
    <div class="form-group"><label>Due Date</label><input type="date" id="tm-due" /></div>
    <div class="form-group"><label>Assign To</label>
      <select id="tm-assignee"><option value="">Unassigned</option></select>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('task-modal')">Cancel</button>
      <button class="btn-save" onclick="saveTask()">Save Task</button>
    </div>
  </div>
</div>

<!-- ADD MEMBER MODAL -->
<div class="modal-overlay" id="member-modal">
  <div class="modal">
    <div class="modal-title">Add Team Member</div>
    <div class="form-group"><label>Select User</label>
      <select id="mm-user"></select>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('member-modal')">Cancel</button>
      <button class="btn-save" onclick="addMember()">Add Member</button>
    </div>
  </div>
</div>

<script>
// ─── STATE ────────────────────────────────────────────────────────────────────
let currentPage = 'dashboard';
let currentProject = null;
let editingProjectId = null;
let editingTaskId = null;
let allUsers = [];
let allTasks = [];

// ─── INIT ─────────────────────────────────────────────────────────────────────
if (!Auth.isLoggedIn()) window.location.href = 'index.html';

const user = Auth.getUser();
document.getElementById('sb-name').textContent = user.name;
document.getElementById('sb-avatar').textContent = user.name[0].toUpperCase();
const roleEl = document.getElementById('sb-role');
roleEl.textContent = user.role;
if (user.role === 'ADMIN') roleEl.classList.add('admin');

(async () => {
  await loadDashboard();
  allUsers = await API.getUsers().catch(() => []);
})();

// ─── NAVIGATION ───────────────────────────────────────────────────────────────
function showPage(page) {
  ['dashboard','projects','project-detail','my-tasks'].forEach(p => {
    document.getElementById(`page-${p}`).style.display = p === page ? '' : 'none';
  });
  ['dashboard','projects','my-tasks'].forEach(p => {
    document.getElementById(`nav-${p}`)?.classList.toggle('active', p === page);
  });
  currentPage = page;
  if (page === 'dashboard') loadDashboard();
  if (page === 'projects')  loadProjects();
  if (page === 'my-tasks')  loadMyTasks();
}

// ─── DASHBOARD ────────────────────────────────────────────────────────────────
async function loadDashboard() {
  try {
    const s = await API.getDashboard();
    document.getElementById('s-projects').textContent = s.totalProjects;
    document.getElementById('s-total').textContent    = s.totalTasks;
    document.getElementById('s-todo').textContent     = s.todoTasks;
    document.getElementById('s-progress').textContent = s.inProgressTasks;
    document.getElementById('s-done').textContent     = s.doneTasks;
    document.getElementById('s-overdue').textContent  = s.overdueTasks;
  } catch(e) { console.error(e); }
}

// ─── PROJECTS ─────────────────────────────────────────────────────────────────
async function loadProjects() {
  try {
    const projects = await API.getProjects();
    const grid = document.getElementById('projects-grid');
    if (!projects.length) {
      grid.innerHTML = '<div class="empty"><div class="empty-icon">📁</div><div>No projects yet. Create one!</div></div>';
      return;
    }
    grid.innerHTML = projects.map(p => `
      <div class="project-card" onclick="openProject(${p.id})">
        <div class="project-name">${p.name}</div>
        <div class="project-desc">${p.description || 'No description'}</div>
        <div class="project-meta">
          <span class="project-owner">👤 ${p.owner?.name || 'Unknown'}</span>
          <span class="badge badge-${p.status?.toLowerCase()}">${p.status || 'ACTIVE'}</span>
        </div>
      </div>
    `).join('');
  } catch(e) { toast('Failed to load projects', 'error'); }
}

async function openProject(id) {
  try {
    currentProject = await API.getProject(id);
    document.getElementById('detail-title').textContent = currentProject.name;

    const isOwner = currentProject.owner?.id === user.id;
    const canManage = isOwner || user.role === 'ADMIN';
    document.getElementById('add-member-btn').style.display = canManage ? '' : 'none';

    // Header
    document.getElementById('detail-header').innerHTML = `
      <div class="detail-title">${currentProject.name}</div>
      <div class="detail-desc">${currentProject.description || ''}</div>
      <div class="detail-meta">
        <span>Owner: <strong>${currentProject.owner?.name}</strong></span>
        <span>Status: <strong>${currentProject.status}</strong></span>
        <span>Members: <strong>${(currentProject.members?.length || 0) + 1}</strong></span>
      </div>
      ${canManage ? `<div style="margin-top:12px;display:flex;gap:8px">
        <button class="btn-sm" onclick="openProjectModal(${currentProject.id})">✏️ Edit</button>
        <button class="btn-sm danger" onclick="deleteProject(${currentProject.id})">🗑️ Delete</button>
      </div>` : ''}
    `;

    renderMembers();
    await loadKanban();
    showPage('project-detail');
  } catch(e) { toast('Failed to open project', 'error'); }
}

function renderMembers() {
  const owner = currentProject.owner;
  const members = currentProject.members || [];
  const canManage = owner?.id === user.id || user.role === 'ADMIN';

  const ownerChip = `<div class="member-chip"><div class="avatar" style="width:24px;height:24px;font-size:.7rem">${owner?.name[0]}</div>${owner?.name} 👑</div>`;
  const memberChips = members.map(m => `
    <div class="member-chip">
      <div class="avatar" style="width:24px;height:24px;font-size:.7rem">${m.name[0]}</div>
      ${m.name}
      ${canManage ? `<button class="remove-btn" onclick="removeMember(${m.id})">✕</button>` : ''}
    </div>
  `).join('');
  document.getElementById('members-list').innerHTML = ownerChip + memberChips;
}

async function loadKanban() {
  allTasks = await API.getProjectTasks(currentProject.id).catch(() => []);
  const cols = { TODO: [], IN_PROGRESS: [], DONE: [] };
  allTasks.forEach(t => cols[t.status]?.push(t));

  const labels = { TODO: 'To Do', IN_PROGRESS: 'In Progress', DONE: 'Done' };
  const colors = { TODO: 'var(--muted)', IN_PROGRESS: 'var(--accent)', DONE: 'var(--green)' };
  const today = new Date().toISOString().split('T')[0];

  document.getElementById('kanban-board').innerHTML = Object.entries(cols).map(([status, tasks]) => `
    <div class="kanban-col">
      <div class="kanban-col-title" style="color:${colors[status]}">
        ${labels[status]} <span class="count">${tasks.length}</span>
      </div>
      ${tasks.length ? tasks.map(t => {
        const overdue = t.dueDate && t.dueDate < today && t.status !== 'DONE';
        const canEdit = t.assignee?.id === user.id || currentProject.owner?.id === user.id || user.role === 'ADMIN';
        return `<div class="kanban-task">
          <div class="kanban-task-title">${t.title}</div>
          <div class="kanban-task-meta">
            <span class="priority-dot ${t.priority}"></span>
            <span>${t.priority}</span>
            ${t.assignee ? `<span>👤 ${t.assignee.name}</span>` : '<span style="color:var(--muted)">Unassigned</span>'}
            ${t.dueDate ? `<span>${overdue ? `<span class="overdue-tag">Overdue</span>` : '📅 '+t.dueDate}</span>` : ''}
          </div>
          ${canEdit ? `<div class="task-actions">
            <select class="status-select" onchange="quickStatus(${t.id},this.value)">
              <option value="TODO" ${t.status==='TODO'?'selected':''}>To Do</option>
              <option value="IN_PROGRESS" ${t.status==='IN_PROGRESS'?'selected':''}>In Progress</option>
              <option value="DONE" ${t.status==='DONE'?'selected':''}>Done</option>
            </select>
            <button class="btn-sm" onclick="openTaskModal(${t.id})">✏️</button>
            <button class="btn-sm danger" onclick="deleteTask(${t.id})">🗑️</button>
          </div>` : ''}
        </div>`;
      }).join('') : `<div style="color:var(--muted);font-size:.85rem;text-align:center;padding:20px">Empty</div>`}
    </div>
  `).join('');
}

async function quickStatus(taskId, status) {
  try {
    await API.updateStatus(taskId, status);
    await loadKanban();
  } catch(e) { toast(e.message, 'error'); }
}

// ─── MY TASKS ─────────────────────────────────────────────────────────────────
async function loadMyTasks() {
  const tasks = await API.getMyTasks().catch(() => []);
  const today = new Date().toISOString().split('T')[0];
  const el = document.getElementById('my-task-list');
  if (!tasks.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">✅</div><div>No tasks assigned to you yet.</div></div>';
    return;
  }
  el.innerHTML = tasks.map(t => {
    const overdue = t.dueDate && t.dueDate < today && t.status !== 'DONE';
    return `<div class="task-item">
      <div class="priority-dot ${t.priority}"></div>
      <div class="task-info">
        <div class="task-title">${t.title}</div>
        <div class="task-sub">📁 ${t.project?.name || ''}  ${t.dueDate ? '· 📅 ' + t.dueDate : ''} ${overdue ? '<span class="overdue-tag">Overdue</span>' : ''}</div>
      </div>
      <select class="status-select" onchange="myTaskStatus(${t.id},this.value)">
        <option value="TODO" ${t.status==='TODO'?'selected':''}>To Do</option>
        <option value="IN_PROGRESS" ${t.status==='IN_PROGRESS'?'selected':''}>In Progress</option>
        <option value="DONE" ${t.status==='DONE'?'selected':''}>Done</option>
      </select>
    </div>`;
  }).join('');
}

async function myTaskStatus(id, status) {
  try {
    await API.updateStatus(id, status);
    await loadMyTasks();
    toast('Status updated', 'success');
  } catch(e) { toast(e.message, 'error'); }
}

// ─── PROJECT MODAL ────────────────────────────────────────────────────────────
function openProjectModal(id = null) {
  editingProjectId = id;
  document.getElementById('project-modal-title').textContent = id ? 'Edit Project' : 'New Project';
  if (id && currentProject && currentProject.id === id) {
    document.getElementById('pm-name').value   = currentProject.name;
    document.getElementById('pm-desc').value   = currentProject.description || '';
    document.getElementById('pm-status').value = currentProject.status || 'ACTIVE';
  } else {
    document.getElementById('pm-name').value = '';
    document.getElementById('pm-desc').value = '';
    document.getElementById('pm-status').value = 'ACTIVE';
  }
  document.getElementById('project-modal').classList.add('show');
}

async function saveProject() {
  const name = document.getElementById('pm-name').value.trim();
  if (!name) return toast('Project name is required', 'error');
  const body = { name, description: document.getElementById('pm-desc').value, status: document.getElementById('pm-status').value };
  try {
    if (editingProjectId) {
      await API.updateProject(editingProjectId, body);
      toast('Project updated', 'success');
      if (currentProject?.id === editingProjectId) await openProject(editingProjectId);
    } else {
      await API.createProject(body);
      toast('Project created', 'success');
    }
    closeModal('project-modal');
    if (currentPage === 'projects') await loadProjects();
  } catch(e) { toast(e.message, 'error'); }
}

async function deleteProject(id) {
  if (!confirm('Delete this project and all its tasks?')) return;
  try {
    await API.deleteProject(id);
    toast('Project deleted', 'success');
    showPage('projects');
  } catch(e) { toast(e.message, 'error'); }
}

// ─── TASK MODAL ───────────────────────────────────────────────────────────────
function openTaskModal(taskId = null) {
  editingTaskId = taskId;
  document.getElementById('task-modal-title').textContent = taskId ? 'Edit Task' : 'New Task';

  // Populate assignee dropdown from project members + owner
  const members = [currentProject?.owner, ...(currentProject?.members || [])].filter(Boolean);
  document.getElementById('tm-assignee').innerHTML =
    '<option value="">Unassigned</option>' +
    members.map(m => `<option value="${m.id}">${m.name}</option>`).join('');

  if (taskId) {
    const t = allTasks.find(t => t.id === taskId);
    if (t) {
      document.getElementById('tm-title').value     = t.title;
      document.getElementById('tm-desc').value      = t.description || '';
      document.getElementById('tm-priority').value  = t.priority;
      document.getElementById('tm-due').value       = t.dueDate || '';
      document.getElementById('tm-assignee').value  = t.assignee?.id || '';
    }
  } else {
    document.getElementById('tm-title').value = '';
    document.getElementById('tm-desc').value  = '';
    document.getElementById('tm-priority').value = 'MEDIUM';
    document.getElementById('tm-due').value = '';
    document.getElementById('tm-assignee').value = '';
  }
  document.getElementById('task-modal').classList.add('show');
}

async function saveTask() {
  const title = document.getElementById('tm-title').value.trim();
  if (!title) return toast('Task title is required', 'error');
  const body = {
    title,
    description: document.getElementById('tm-desc').value,
    priority: document.getElementById('tm-priority').value,
    dueDate: document.getElementById('tm-due').value || null,
    assigneeId: document.getElementById('tm-assignee').value || null,
  };
  try {
    if (editingTaskId) {
      await API.updateTask(editingTaskId, body);
      toast('Task updated', 'success');
    } else {
      await API.createTask(currentProject.id, body);
      toast('Task created', 'success');
    }
    closeModal('task-modal');
    await loadKanban();
  } catch(e) { toast(e.message, 'error'); }
}

async function deleteTask(id) {
  if (!confirm('Delete this task?')) return;
  try {
    await API.deleteTask(id);
    toast('Task deleted', 'success');
    await loadKanban();
  } catch(e) { toast(e.message, 'error'); }
}

// ─── MEMBER MODAL ─────────────────────────────────────────────────────────────
async function openAddMemberModal() {
  const existingIds = new Set([(currentProject.owner?.id), ...(currentProject.members?.map(m=>m.id)||[])]);
  const eligible = allUsers.filter(u => !existingIds.has(u.id));
  if (!eligible.length) return toast('All users are already members', 'error');
  document.getElementById('mm-user').innerHTML = eligible.map(u => `<option value="${u.id}">${u.name} (${u.email})</option>`).join('');
  document.getElementById('member-modal').classList.add('show');
}

async function addMember() {
  const uid = document.getElementById('mm-user').value;
  try {
    currentProject = await API.addMember(currentProject.id, uid);
    renderMembers();
    closeModal('member-modal');
    toast('Member added', 'success');
  } catch(e) { toast(e.message, 'error'); }
}

async function removeMember(uid) {
  if (!confirm('Remove this member?')) return;
  try {
    currentProject = await API.removeMember(currentProject.id, uid);
    renderMembers();
    toast('Member removed', 'success');
  } catch(e) { toast(e.message, 'error'); }
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function logout() { Auth.clear(); window.location.href = 'index.html'; }

function toast(msg, type='success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// Click outside modal to close
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('show'); });
});
</script>
</body>
